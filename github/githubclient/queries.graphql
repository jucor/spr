	$repo_owner: String!,	
	$repo_name: String!,	
){
	viewer {
		login
		pullRequests(first:100, states:[OPEN]) {
			nodes {
				id
				number
				title
				body
				baseRefName
				headRefName
				mergeable
				reviewDecision
				repository {
